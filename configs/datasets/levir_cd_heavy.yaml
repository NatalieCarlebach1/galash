# LEVIR-CD heavy augmentation / training config (2026-04-28 update).
# Now matches SChanger / open-cd "strong" recipe + bitemporal CutMix:
#   - D8 spatial group (flips + rotate ±20°)
#   - random_crop (cat_max_ratio=0.75)
#   - temporal_swap (ExchangeTime)
#   - photometric_distortion (mmseg defaults at LEVIR scale)
#   - color_jitter (independent ref/tgt) — newly added vs ChangerEx
#   - gaussian_blur (independent) — newly added vs ChangerEx, used by SChanger
#   - random_erase (cutout) — light regularizer, +0.2-0.5 F1 typical
#   - cutmix_bitemporal (training-time, batch level) — paper-defining heavy aug
#
# Reference (original ChangerEx pipeline preserved as the "minimal" lower bound):
#   MultiImgRandomRotFlip + MultiImgRandomCrop(cat_max_ratio=0.75)
#   + MultiImgExchangeTime + MultiImgPhotoMetricDistortion

dataset: levir_cd
img_size: 256
test_img_size: 256

normalization:
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

augmentations:
  - {op: random_flip,    direction: horizontal, prob: 0.5}
  - {op: random_flip,    direction: vertical,   prob: 0.5}
  - {op: random_rotate,  degrees: 20, prob: 0.5}
  - {op: random_crop,    size: 256, cat_max_ratio: 0.75}
  - {op: temporal_swap,  prob: 0.5}
  - {op: photometric_distortion, brightness_delta: 10,
     contrast_range: [0.8, 1.2], saturation_range: [0.8, 1.2], hue_delta: 10,
     prob: 0.5}
  - {op: color_jitter,   brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.05,
     independent: true, prob: 0.5}
  - {op: gaussian_blur,  radius_range: [0.0, 1.0], independent: true, prob: 0.3}
  - {op: random_erase,   scale: [0.02, 0.15], ratio: [0.3, 3.3], n: 1,
     fill: random, independent: true, prob: 0.25}

training:
  batch: 16
  epochs: 300
  patience: 15
  lr: 1.0e-4
  warmup: 3
  decoder_lr_scale: 0.1
  finetune_decoder: false
  tta: true
  cutmix_alpha: 1.0
  cutmix_prob: 0.5

reference_methods:
  - {name: SChanger,     year: 2025, f1: 0.9287, url: "https://arxiv.org/abs/2503.20734"}
  - {name: TTP,          year: 2024, f1: 0.9210, url: "https://arxiv.org/abs/2312.16202"}
  - {name: BAN,          year: 2024, f1: 0.9186, url: "https://arxiv.org/abs/2312.01163"}
  - {name: ChangerEx,    year: 2023, f1: 0.9177}
  - {name: ChangeFormer, year: 2022, f1: 0.9111}
