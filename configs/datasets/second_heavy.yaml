# SECOND (binary collapse) heavy augmentation / training config (2026-05-03).
# Adds D8 group + temporal_swap + photometric on top of SAM-CD's minimal recipe.
# SECOND has ~3000 train pairs after auto val split — small enough that heavy
# regularization should help vs the 0.6730 base+ baseline.

dataset: second
img_size: 512
test_img_size: 512

normalization:
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

augmentations:
  - {op: random_flip,    direction: horizontal, prob: 0.5}
  - {op: random_flip,    direction: vertical,   prob: 0.5}
  - {op: random_rotate,  degrees: 20, prob: 0.5}
  - {op: random_crop,    size: 512, cat_max_ratio: 0.75}
  - {op: temporal_swap,  prob: 0.5}
  - {op: photometric_distortion, brightness_delta: 10,
     contrast_range: [0.8, 1.2], saturation_range: [0.8, 1.2], hue_delta: 10,
     prob: 0.5}
  - {op: color_jitter,   brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.05,
     independent: true, prob: 0.5}
  - {op: gaussian_blur,  radius_range: [0.0, 1.0], independent: true, prob: 0.3}

training:
  batch: 8
  epochs: 300
  patience: 15
  lr: 1.0e-4
  warmup: 3
  decoder_lr_scale: 0.1
  finetune_decoder: false
  tta: true

reference_methods:
  - {name: SAM-SCD/SCD-SAM, year: 2024, f1: 0.7246}
  - {name: "AnyChange+ChangeStar", year: 2024, f1: 0.4820, notes: "unsupervised"}
