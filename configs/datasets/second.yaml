# SECOND (binary collapse) augmentation / training config.
# Matches the SAM-CD / SAM-SCD-family pipeline — minimal: random crop +
# horizontal flip, no photometric. The current supervised SOTA on binary
# SECOND (UniChange, 73.12 F1) does NOT declare any augmentation in its
# released code — we follow SAM-CD conventions instead.
#
# Binary label rule: M = (label1 != label2) & (label1 > 0) & (label2 > 0)
# (ignore pixels with unlabeled class 0 in either timestep).

dataset: second
img_size: 512
test_img_size: 512

normalization:
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

augmentations:
  - {op: random_crop,  size: 512, cat_max_ratio: 0.75}
  - {op: random_flip,  direction: horizontal, prob: 0.5}

training:
  batch: 8              # SECOND has 512² tiles; bs=16 at 512 may OOM on some GPUs
  epochs: 300
  patience: 15
  lr: 1.0e-4
  warmup: 3
  decoder_lr_scale: 0.1
  finetune_decoder: false
  tta: true

reference_methods:
  - {name: UniChange,   year: 2025, f1: 0.7312, url: "https://arxiv.org/abs/2511.02607"}
  - {name: SAM-SCD/SCD-SAM, year: 2024, f1: 0.7246, notes: "exact aug undisclosed"}
  - {name: "AnyChange+ChangeStar", year: 2024, f1: 0.4820, notes: "unsupervised"}
