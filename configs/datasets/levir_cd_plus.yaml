# LEVIR-CD+ augmentation / training config.
# Matches ChangeStar / Changen pipeline (ICCV 2023): D4 dihedral group
# + scale jitter + random crop to 512 + ImageNet normalisation on concat
# 6-channel stack. No photometric or elastic aug.
#
# Reference (verbatim from Z-Zheng/ChangeStar configs/levircd/standard.py):
#   OneOf([HorizontalFlip, VerticalFlip, RandomRotate90], p=0.5)   # D4 dihedral
#   RandomDiscreteScale([0.75, 1.25, 1.5], p=0.5)
#   RandomCrop(512, 512, True)
#   Normalize(mean/std ImageNet applied to concat 6-channel stack)

dataset: levir_cd_plus
img_size: 512           # cropped from native 1024×1024 tiles
test_img_size: 1024     # full tile at test

normalization:
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

augmentations:
  # D4 dihedral via one_of choice
  - {op: one_of,
     ops: [
       {op: random_flip,   direction: horizontal, prob: 1.0},
       {op: random_flip,   direction: vertical,   prob: 1.0},
       {op: random_rotate, degrees: 90, prob: 1.0, discrete: true},
     ],
     prob: 0.5}
  - {op: random_scale, scales: [0.75, 1.25, 1.5], prob: 0.5}
  - {op: random_crop,  size: 512}

training:
  batch: 16
  epochs: 300
  patience: 15
  lr: 6.0e-5           # matches Changen fine-tune LR
  warmup: 3
  decoder_lr_scale: 0.1
  finetune_decoder: false
  tta: true

reference_methods:
  - {name: "ChangeStar + Changen", year: 2023, f1: 0.9150, url: "https://arxiv.org/abs/2309.17351"}
  - {name: ChangeStar,             year: 2021, f1: 0.9050}
  - {name: DDCDNet,                year: 2024, f1: 0.8771}
