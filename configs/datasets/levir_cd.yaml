# LEVIR-CD augmentation / training config.
# Matches the open-cd / ChangerEx pipeline (which itself matches TTP and BAN
# with small deltas). Intentionally excludes augmentations not used by top
# methods on this benchmark (e.g. mixup, cutmix, elastic deformation) to
# keep the comparison fair.
#
# Reference pipeline (verbatim from open-cd configs/_base_/datasets/levir_cd.py
# and configs/changer/changer_ex_r18_512x512_40k_levircd.py):
#   MultiImgLoadImageFromFile
#   MultiImgLoadAnnotations
#   MultiImgRandomRotFlip(rotate_prob=0.5, flip_prob=0.5, degree=(-20, 20))
#   MultiImgRandomCrop(crop_size=(512, 512), cat_max_ratio=0.75)
#   MultiImgExchangeTime(prob=0.5)
#   MultiImgPhotoMetricDistortion(brightness_delta=10, contrast_range=(0.8,1.2),
#                                 saturation_range=(0.8,1.2), hue_delta=10)
#   MultiImgPackSegInputs

dataset: levir_cd
img_size: 256            # LEVIR-CD-256 crops are already 256
test_img_size: 256

normalization:
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

augmentations:
  # Applied in order; any op not listed is NOT applied.
  - {op: random_flip,    direction: horizontal, prob: 0.5}
  - {op: random_flip,    direction: vertical,   prob: 0.5}
  - {op: random_rotate,  degrees: 20, prob: 0.5}
  - {op: random_crop,    size: 256, cat_max_ratio: 0.75}
  - {op: temporal_swap,  prob: 0.5}
  - {op: photometric_distortion, brightness_delta: 10,
     contrast_range: [0.8, 1.2], saturation_range: [0.8, 1.2], hue_delta: 10}

training:
  batch: 16
  epochs: 300
  patience: 15
  lr: 1.0e-4
  warmup: 3
  decoder_lr_scale: 0.1
  finetune_decoder: false
  tta: true

reference_methods:
  - {name: SChanger,     year: 2025, f1: 0.9287, url: "https://arxiv.org/abs/2503.20734"}
  - {name: TTP,          year: 2024, f1: 0.9210, url: "https://arxiv.org/abs/2312.16202"}
  - {name: BAN,          year: 2024, f1: 0.9186, url: "https://arxiv.org/abs/2312.01163"}
  - {name: ChangerEx,    year: 2023, f1: 0.9177}
  - {name: ChangeFormer, year: 2022, f1: 0.9111}
